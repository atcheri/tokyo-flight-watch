name: Tokyo flight watch

on:
  schedule:
    - cron: "0 6 */3 * *" # tous les 3 jours vers 06:00 UTC, pour économiser les crédits gratuits
  workflow_dispatch:
    inputs:
      args:
        description: "Options du programme, ex. -dry-run -summary"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: flight-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check prices
        env:
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ARGS: ${{ inputs.args }}
        run: go run ./cmd/watch $ARGS

      - name: Commit price history
        if: always()
        run: |
          git config user.name "flight-watch"
          git config user.email "flight-watch@users.noreply.github.com"
          git add state/history.json
          git diff --cached --quiet || git commit -m "Update price history $(date -u +%F)"
          git push
