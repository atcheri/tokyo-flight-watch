name: Tokyo flight watch

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 7h/8h à Paris
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flight-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check prices
        env:
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: go run ./cmd/watch

      - name: Commit price history
        if: always()
        run: |
          git config user.name "flight-watch"
          git config user.email "flight-watch@users.noreply.github.com"
          git add state/history.json
          git diff --cached --quiet || git commit -m "Update price history $(date -u +%F)"
          git push
