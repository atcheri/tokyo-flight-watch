# Fournisseur de données. Le calendrier de prix n'existe que chez searchapi (SearchApi.io, clé SEARCHAPI_KEY).
provider: searchapi

# Aéroports de départ et d'arrivée (codes IATA)
origins: [FRA, CGN, DUS]
destinations: [HND, NRT]
preferred_destination: HND

# Fenêtre de départ (incluse) et durées de séjour en jours
departure_from: 2027-03-22
departure_to: 2027-04-15
min_stay_days: 7
max_stay_days: 17

adults: 1
max_stops: 1

# Règles « bonne offre » (EUR, aller-retour par personne). Une seule suffit pour alerter.
direct_star_alliance_max_price: 1300  # vol direct Star Alliance (aller et retour)
default_max_price: 1050               # toute autre offre avec au plus 1 escale
price_drop_percent: 15                # baisse vs plus bas déjà relevé pour les mêmes dates
new_low_min_percent: 2                # nouveau plus bas toutes dates confondues, d'au moins X %
alert_on_google_low: true             # Google Flights juge le prix « bas »
narita_min_saving: 100                # NRT signalé seulement s'il est au moins X € moins cher que HND

# Requêtes API par lancement : le calendrier couvre toute la grille de dates en 3 requêtes,
# fois 2 (toutes compagnies + direct Star Alliance), plus au plus N recherches détaillées.
max_detail_searches: 2

# Résumé hebdomadaire Telegram (jour en anglais, vide pour désactiver)
summary_weekday: monday
