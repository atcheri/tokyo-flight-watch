# Aéroports de départ et d'arrivée (codes IATA)
origins: [FRA, CGN, DUS]
destinations: [HND, NRT]
preferred_destination: HND
narita_min_saving: 100          # un autre aéroport n'est retenu que s'il est au moins X € moins cher

# Fenêtre de départ (incluse) et durées de séjour en jours
departure_from: 2027-03-22
departure_to: 2027-04-15
min_stay_days: 7
max_stay_days: 17

adults: 1
max_stops: 1
watch_direct: true              # surveille aussi les vols directs (aller ET retour) de direct_airlines
direct_airlines: STAR_ALLIANCE

# Alerte quand le prix le plus bas d'une catégorie est sous la cible,
# OU au moins sensitivity_percent sous le meilleur prix habituel (médiane des meilleurs prix
# des typical_window_days derniers jours ; il faut au moins 3 jours d'historique).
target_price: 1050              # toutes compagnies, ≤ 1 escale (0 = pas de cible)
target_price_direct: 1300       # vols directs Star Alliance (0 = pas de cible)
sensitivity_percent: 10
typical_window_days: 14

# Anti-répétition : une nouvelle alerte doit battre la précédente de max(30 €, 3 %).
# L'alerte précédente est oubliée quand son tarif a disparu depuis 3 lancements.
min_improvement_eur: 30
min_improvement_percent: 3
alert_expiry_runs: 3

# Quota SearchApi : un lancement = 3 requêtes par catégorie (6 avec watch_direct),
# plus une recherche détaillée par alerte.
max_requests_per_run: 8
min_credits_warning: 30         # avertit sur Telegram sous ce nombre de crédits

summary_every_days: 6           # résumé périodique (0 = désactivé), multiple de la fréquence des lancements
