# Coolify: create a "Docker Compose" resource from this repository and set the
# environment variables below in the Coolify UI.
services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set the bot token from @BotFather}
      BOT_SECRET_KEY: ${BOT_SECRET_KEY:?set a key from `openssl rand -base64 32`}
      INVITE_CODE: ${INVITE_CODE:?set the invite code}
      MAX_WATCHES: ${MAX_WATCHES:-5}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      DATA_DIR: /data
    volumes:
      - bot-data:/data
    # Docker keeps container logs forever by default: cap them at 3 × 10 MB.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bot-data:
